<!--
Assignment 4: Creating a Basic HTML Table [19/06/2024]
Create an HTML page with a title in the <title> tag and a heading using the <h1> tag.
Add a basic HTML table using the <table> tag, with a table header using the <thead> tag,
a table body using the <tbody> tag, and at least three rows of data. Each row should
contain three columns, and the table should have appropriate headings for each column
using the <th> tag.
-->
<!DOCTYPE html>
<html>
<head>
    <title>Basic Table</title>
</head>
<body>

    <h1>Student Marks</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Riya</td>
                <td>Maths</td>
                <td>88</td>
            </tr>
            <tr>
                <td>Aman</td>
                <td>Science</td>
                <td>92</td>
            </tr>
            <tr>
                <td>Karan</td>
                <td>English</td>
                <td>79</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
